services:
  postgresql:
    image: postgres:16-alpine
    container_name: ciam-lab-postgresql
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ciam_lab}
      POSTGRES_USER: ${POSTGRES_USER:-ciam_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ciam_lab_dev}
    volumes:
      - ciam_lab_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ciam_app} -d ${POSTGRES_DB:-ciam_lab}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ciam-lab-pgadmin
    restart: unless-stopped
    profiles:
      - admin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ciam-lab.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-ciam_lab_dev}
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  ciam_lab_pgdata:
