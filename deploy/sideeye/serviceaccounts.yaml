# IRSA service accounts: sideeye-chip / sideeye-ciam
# Annotate with the IAM role ARN that can:
#   secretsmanager:GetSecretValue on sideeye/tokens
#   bedrock:InvokeModel on the Claude model
#   (optional) elasticfilesystem client mount via CSI driver
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sideeye-chip
  namespace: sideeye
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/sideeye-chip
  labels:
    app.kubernetes.io/name: sideeye
    sideeye.profile: chip
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sideeye-ciam
  namespace: sideeye
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/sideeye-ciam
  labels:
    app.kubernetes.io/name: sideeye
    sideeye.profile: ciam
