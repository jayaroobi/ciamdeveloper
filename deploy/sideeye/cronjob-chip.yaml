# CronJob sideeye-chip — every 5 minutes
# Pod: ciam-reviewer --profile chip ; IRSA sideeye-chip
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sideeye-chip
  namespace: sideeye
  labels:
    app.kubernetes.io/name: sideeye
    sideeye.profile: chip
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: ciam-reviewer
            sideeye.profile: chip
        spec:
          serviceAccountName: sideeye-chip
          restartPolicy: OnFailure
          containers:
            - name: ciam-reviewer
              image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/sideeye:latest
              imagePullPolicy: IfNotPresent
              args: ["--profile", "chip"]
              env:
                - name: AWS_REGION
                  value: us-east-1
                - name: SIDEYE_SECRET_ID
                  value: sideeye/tokens
                - name: SIDEYE_STATE_DIR
                  value: /mnt/sideeye-state
                - name: BEDROCK_MODEL_ID
                  value: anthropic.claude-opus-4-20250514-v1:0
                - name: SIDEYE_CHIP_WORKSPACE
                  valueFrom:
                    configMapKeyRef:
                      name: sideeye-config
                      key: chip_workspace
                      optional: true
                - name: SIDEYE_CHIP_REPOS
                  valueFrom:
                    configMapKeyRef:
                      name: sideeye-config
                      key: chip_repos
                      optional: true
                - name: SONAR_URL
                  valueFrom:
                    configMapKeyRef:
                      name: sideeye-config
                      key: sonar_url
                      optional: true
                - name: JIRA_URL
                  valueFrom:
                    configMapKeyRef:
                      name: sideeye-config
                      key: jira_url
                      optional: true
                - name: OCTOPUS_URL
                  valueFrom:
                    configMapKeyRef:
                      name: sideeye-config
                      key: octopus_url
                      optional: true
              volumeMounts:
                - name: sideeye-state
                  mountPath: /mnt/sideeye-state
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: sideeye-state
              persistentVolumeClaim:
                claimName: sideeye-state
